alang=en
log-file=~/log
fullscreen=yes

# Wayland
gpu-context=wayland
vo=gpu-next
hwdec=auto
gpu-api=opengl

# Fix stutters
pipewire-buffer=100
profile=fast
scale=bilinear

save-position-on-quit=yes

# Subtitle preferences
slang=en,eng
sid=auto

# Load external subtitle files whose filenames are close to the video filename.
sub-auto=fuzzy

# Also search conventional subtitle subdirectories beside a video.
sub-file-paths=.,subs,Subs,subtitles

# Make subtitles easier to read; tune later to taste.
sub-font-size=42
sub-border-size=2.5
sub-shadow-offset=1.5
sub-color=#FFFFFFFF
sub-border-color=#000000FF
sub-shadow-color=#000000C0
sub-margin-y=42
